    #timer-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #4CAF50, #FFC107, #F44336); border-radius: 12px; transition: width 0.3s; }
    #timer-label { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 0.75rem; font-weight: 700; text-shadow: 0 1px 3px rgba(0,0,0,0.5); }

    #dance-cooldown-container { position: relative; width: 180px; height: 30px; background: rgba(0,0,0,0.4); border-radius: 15px; overflow: hidden; }
    #dance-cooldown-bar { width: 100%; height: 100%; background: linear-gradient(90deg, #e040fb, #7c4dff); border-radius: 15px; transition: width 0.1s; }

    #controls-hint { position: absolute; bottom: 60px; left: 0; right: 0; text-align: center; color: rgba(255,255,255,0.5); font-size: 0.7rem; display: flex; gap: 15px; justify-content: center; }
    #level-complete { background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; pointer-events: auto; }
    #stars-display { font-size: 3rem; margin: 1rem 0; }
    #bonus-text { color: #FFD700; font-size: 0.9rem; margin-bottom: 1rem; }
    #game-over { background: rgba(30,0,0,0.8); display: flex; align-items: center; justify-content: center; pointer-events: auto; }
    #game-over h1 { color: #ff6b6b; }
  </style>

  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"

<script type="module">
import * as THREE from 'three';

// ============ GameState ============
class GameState {
  constructor() { this.reset(); }
  reset() {
    this.playing = false; this.paused = false; this.score = 0; this.falls = 0;
    this.danceBoostsUsed = 0; this.checkpointsReached = 0; this.currentLevel = 1;
    this.levelTime = 0; this.levelDuration = 180; this.collapsePercent = 0;
    this.levelComplete = false; this.gameOver = false;
    this.danceBoostActive = false; this.danceBoostTimer = 0; this.danceBoostCooldown = 0;
    this.danceBoostDuration = 3; this.danceBoostCooldownDuration = 10;
    this.lastCheckpoint = null; this.spawnPosition = { x: 0, y: 2, z: 0 };
  }
  addScore(p) { this.score += p; }
  getStarRating() {
    const fast = this.levelTime < this.levelDuration * 0.5;
    const noFalls = this.falls === 0;
    if (noFalls && fast) return 3;
    if (fast || noFalls) return 2;
    return 1;
  }
}

// ============ InputManager ============
class InputManager {
  constructor() {
    this.keys = { forward: false, left: false, right: false, jump: false, sprint: false, dance: false, r: false };
    this._jumpPressed = false; this._dancePressed = false;
    window.addEventListener('keydown', e => this.onKeyDown(e));
    window.addEventListener('keyup', e => this.onKeyUp(e));
  }
  onKeyDown(e) {
    switch (e.code) {
      case 'KeyW': case 'ArrowUp': this.keys.forward = true; break;
      case 'KeyA': case 'ArrowLeft': this.keys.left = true; break;
      case 'KeyD': case 'ArrowRight': this.keys.right = true; break;
      case 'Space': e.preventDefault(); if (!this._jumpPressed) { this.keys.jump = true; this._jumpPressed = true; } break;
      case 'ShiftLeft': case 'ShiftRight': this.keys.sprint = true; break;
      case 'KeyE': if (!this._dancePressed) { this.keys.dance = true; this._dancePressed = true; } break;
      case 'KeyR': this.keys.r = true; break;
    }
  }
  onKeyUp(e) {
    switch (e.code) {
      case 'KeyW': case 'ArrowUp': this.keys.forward = false; break;
      case 'KeyA': case 'ArrowLeft': this.keys.left = false; break;
      case 'KeyD': case 'ArrowRight': this.keys.right = false; break;
      case 'Space': this._jumpPressed = false; break;
      case 'ShiftLeft': case 'ShiftRight': this.keys.sprint = false; break;
      case 'KeyE': this._dancePressed = false; break;
      case 'KeyR': this.keys.r = false; break;
    }
  }
  update() {}
  consumeJump() { if (this.keys.jump) { this.keys.jump = false; return true; } return false; }
  consumeDance() { if (this.keys.dance) { this.keys.dance = false; return true; } return false; }
}

// ============ AudioManager ============
class AudioManager {
  constructor() { this.audioCtx = null; this.initialized = false; }
  init() {
    if (this.initialized) return;
    try { this.audioCtx = new (window.AudioContext || window.webkitAudioContext)(); this.initialized = true; } catch(e) {}
  }
  playTone(freq, dur, type='sine', vol=0.15) {
    this.init();
    if (!this.audioCtx) return;
    const osc = this.audioCtx.createOscillator();
    const gain = this.audioCtx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, this.audioCtx.currentTime);
    gain.gain.setValueAtTime(vol, this.audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + dur);
    osc.connect(gain); gain.connect(this.audioCtx.destination); osc.start(); osc.stop(this.audioCtx.currentTime + dur);
  }
  playJump() { this.playTone(400,0.15,'sine',0.1); setTimeout(()=>this.playTone(600,0.1,'sine',0.08),50); }
  playLand() { this.playTone(150,0.1,'triangle',0.06); }
  playFall() { this.playTone(300,0.4,'sawtooth',0.08); setTimeout(()=>this.playTone(150,0.3,'sawtooth',0.06),200); }
  playCheckpoint() { this.playTone(523,0.15,'sine',0.12); setTimeout(()=>this.playTone(659,0.15,'sine',0.12),100); setTimeout(()=>this.playTone(784,0.2,'sine',0.12),200); }
  playDanceBoost() { this.playTone(440,0.1,'square',0.08); setTimeout(()=>this.playTone(554,0.1,'square',0.08),80); setTimeout(()=>this.playTone(659,0.1,'square',0.08),160); setTimeout(()=>this.playTone(880,0.2,'square',0.08),240); }
  playPortal() { for(let i=0;i<5;i++) setTimeout(()=>this.playTone(400+i*100,0.3,'sine',0.1),i*100); }
  playAlarmTick() { this.playTone(800,0.05,'square',0.04); }
  playCollapse() { this.playTone(100,0.5,'sawtooth',0.1); }
  playBounce() { this.playTone(300,0.15,'sine',0.1); setTimeout(()=>this.playTone(500,0.1,'sine',0.08),50); }
}

// ============ ParticleSystem ============
class Particle {
  constructor(mesh, velocity, lifetime, gravity=-5) {
    this.mesh = mesh; this.velocity = velocity; this.lifetime = lifetime; this.maxLifetime = lifetime; this.gravity = gravity;
  }
  update(delta) {
    this.velocity.y += this.gravity * delta;
    this.mesh.position.add(this.velocity.clone().multiplyScalar(delta));
    this.lifetime -= delta;
    const t = this.lifetime / this.maxLifetime;
    this.mesh.material.opacity = t; this.mesh.scale.setScalar(t * 0.8 + 0.2);
    return this.lifetime > 0;
  }
}

class ParticleSystem {
  constructor(scene) { this.scene = scene; this.particles = []; }
  spawnConfetti(position, count=30) {
    const colors = [0xff6b6b,0xffd93d,0x6bcb77,0x4d96ff,0xff6bcb,0xffa94d];
    for (let i=0; i<count; i++) {
      const geo = new THREE.PlaneGeometry(0.15,0.15);
      const mat = new THREE.MeshBasicMaterial({ color: colors[Math.floor(Math.random()*colors.length)], transparent: true, opacity: 1, side: THREE.DoubleSide });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.copy(position); mesh.position.y += 2;
      mesh.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
      this.scene.add(mesh);
      const vel = new THREE.Vector3((Math.random()-0.5)*6, Math.random()*8+3, (Math.random()-0.5)*6);
      this.particles.push(new Particle(mesh, vel, 2+Math.random(), -8));
    }
  }
  spawnSparkles(position, count=5) {
    const colors = [0xff00ff,0xffff00,0x00ffff,0xff88ff];
    for (let i=0; i<count; i++) {
      const geo = new THREE.SphereGeometry(0.05,4,4);
      const mat = new THREE.MeshBasicMaterial({ color: colors[Math.floor(Math.random()*colors.length)], transparent: true, opacity: 1 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.copy(position);
      mesh.position.x += (Math.random()-0.5)*1.5; mesh.position.y += Math.random()*2; mesh.position.z += (Math.random()-0.5)*1.5;
      this.scene.add(mesh);
      const vel = new THREE.Vector3((Math.random()-0.5)*2, Math.random()*3+1, (Math.random()-0.5)*2);
      this.particles.push(new Particle(mesh, vel, 0.6+Math.random()*0.4, -3));
    }
  }
  spawnPortalParticles(position, count=15) {
    for (let i=0; i<count; i++) {
      const geo = new THREE.SphereGeometry(0.08,4,4);
      const mat = new THREE.MeshBasicMaterial({ color: new THREE.Color().setHSL(Math.random()*0.3+0.5,1,0.6), transparent: true, opacity: 1 });
      const mesh = new THREE.Mesh(geo, mat);
      const angle = Math.random()*Math.PI*2; const radius = 1.5+Math.random();
      mesh.position.set(position.x+Math.cos(angle)*radius, position.y+Math.random()*3, position.z+Math.sin(angle)*radius);
      this.scene.add(mesh);
      const vel = new THREE.Vector3(-Math.cos(angle)*2, Math.random()*2+1, -Math.sin(angle)*2);
      this.particles.push(new Particle(mesh, vel, 1+Math.random(), -1));
    }
  }
  update(delta) {
    for (let i=this.particles.length-1; i>=0; i--) {
      if (!this.particles[i].update(delta)) {
        this.scene.remove(this.particles[i].mesh);
        this.particles[i].mesh.geometry.dispose(); this.particles[i].mesh.material.dispose();
        this.particles.splice(i, 1);
      }
    }
  }
}

// ============ CharacterController ============
class CharacterController {
  constructor(scene, state, input, audio, particles) {
    this.scene = scene; this.state = state; this.input = input; this.audio = audio; this.particles = particles;
    this.position = new THREE.Vector3(state.spawnPosition.x, state.spawnPosition.y, state.spawnPosition.z);
    this.velocity = new THREE.Vector3(0,0,0);
    this.grounded = false; this.groundY = 0;
    this.baseSpeed = 6; this.sprintSpeed = 8; this.autoRunSpeed = 1.5; this.jumpForce = 14;
    this.gravity = -25; this.airControl = 0.6; this.strafeSpeed = 8;
    this.coyoteTime = 0.25; this.coyoteTimer = 0; this.wasGrounded = false;
    this.danceBoosting = false; this.danceTimer = 0;
    this.bobPhase = 0; this.dancePhase = 0; this.celebrating = false; this.celebrateTimer = 0;
    this.fallThreshold = -12; this.colliderRadius = 0.4; this.colliderHeight = 1.8;
    this.mesh = this.createCharacterMesh(); this.mesh.position.copy(this.position); this.scene.add(this.mesh);
    this.discoLight = new THREE.PointLight(0xff00ff, 0, 8); this.discoLight.position.set(0,-0.5,0); this.mesh.add(this.discoLight);
  }
  createCharacterMesh() {
    const g = new THREE.Group();
    const bodyGeo = new THREE.CylinderGeometry(0.35,0.3,1.0,8);
    const body = new THREE.Mesh(bodyGeo, new THREE.MeshStandardMaterial({color:0xddeeff}));
    body.position.y = 0.5; body.castShadow = true; g.add(body);
    for (let i=0;i<4;i++) {
      const s = new THREE.Mesh(new THREE.CylinderGeometry(0.36,0.31,0.05,8), new THREE.MeshStandardMaterial({color:0x6688cc}));
      s.position.y = 0.2+i*0.22; g.add(s);
    }
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.3,12,10), new THREE.MeshStandardMaterial({color:0xffcc99}));
    head.position.y = 1.3; head.castShadow = true; g.add(head);
    const eyeMat = new THREE.MeshStandardMaterial({color:0x222222});
    const le = new THREE.Mesh(new THREE.SphereGeometry(0.05,6,6), eyeMat); le.position.set(-0.1,1.35,0.25); g.add(le);
    const re = new THREE.Mesh(new THREE.SphereGeometry(0.05,6,6), eyeMat); re.position.set(0.1,1.35,0.25); g.add(re);
    const smile = new THREE.Mesh(new THREE.TorusGeometry(0.08,0.02,4,8,Math.PI), new THREE.MeshStandardMaterial({color:0xff6666}));
    smile.position.set(0,1.22,0.26); smile.rotation.z = Math.PI; g.add(smile);
    const cape = new THREE.Mesh(new THREE.PlaneGeometry(0.6,0.8), new THREE.MeshStandardMaterial({color:0xff3333,side:THREE.DoubleSide}));
    cape.position.set(0,0.6,-0.35); cape.rotation.x = 0.1; cape.castShadow = true; g.add(cape); this.cape = cape;
    const armMat = new THREE.MeshStandardMaterial({color:0xddeeff});
    const la = new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08,0.5,6), armMat); la.position.set(-0.45,0.7,0); la.rotation.z=0.3; g.add(la); this.leftArm = la;
    const ra = new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08,0.5,6), armMat); ra.position.set(0.45,0.7,0); ra.rotation.z=-0.3; g.add(ra); this.rightArm = ra;
    const legMat = new THREE.MeshStandardMaterial({color:0xddeeff});
    const ll = new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.08,0.5,6), legMat); ll.position.set(-0.15,-0.05,0); g.add(ll); this.leftLeg = ll;
    const rl = new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.08,0.5,6), legMat); rl.position.set(0.15,-0.05,0); g.add(rl); this.rightLeg = rl;
    const footMat = new THREE.MeshStandardMaterial({color:0xffcc99});
    const fGeo = new THREE.SphereGeometry(0.1,6,6); fGeo.scale(1,0.5,1.3);
    const lf = new THREE.Mesh(fGeo, footMat); lf.position.set(-0.15,-0.3,0.05); g.add(lf);
    const rf = new THREE.Mesh(fGeo.clone(), footMat); rf.position.set(0.15,-0.3,0.05); g.add(rf);
    return g;
  }
  update(delta) {
    if (this.celebrating) { this.celebrateTimer -= delta; this.danceAnimation(delta); if (this.celebrateTimer<=0) this.celebrating=false; this.mesh.position.copy(this.position); return; }
    this.updateDanceBoost(delta);
    const airMult = this.grounded ? 1 : this.airControl;
    let forwardSpeed = this.autoRunSpeed;
    if (this.input.keys.forward) forwardSpeed = this.baseSpeed;
    if (this.input.keys.sprint) forwardSpeed = this.sprintSpeed;
    if (this.state.danceBoostActive) forwardSpeed *= 1.2;
    this.velocity.z = forwardSpeed;
    let strafeVel = 0;
    if (this.input.keys.left) strafeVel = -this.strafeSpeed * airMult;
    if (this.input.keys.right) strafeVel = this.strafeSpeed * airMult;
    this.velocity.x = strafeVel;
    if (this.grounded) this.coyoteTimer = this.coyoteTime; else this.coyoteTimer -= delta;
    if (this.input.consumeJump() && this.coyoteTimer > 0) {
      let jf = this.jumpForce; if (this.state.danceBoostActive) jf *= 1.25;
      this.velocity.y = jf; this.grounded = false; this.coyoteTimer = 0; this.audio.playJump();
    }
    if (!this.grounded) this.velocity.y += this.gravity * delta;
    this.position.x += this.velocity.x * delta; this.position.y += this.velocity.y * delta; this.position.z += this.velocity.z * delta;
    this.wasGrounded = this.grounded;
    if (this.position.y < this.fallThreshold) this.onFall();
    this.mesh.position.copy(this.position);
    this.animate(delta);
  }
  updateDanceBoost(delta) {
    if (this.state.danceBoostCooldown > 0) this.state.danceBoostCooldown -= delta;
    if (this.input.consumeDance() && this.state.danceBoostCooldown <= 0 && !this.state.danceBoostActive) {
      this.state.danceBoostActive = true; this.state.danceBoostTimer = this.state.danceBoostDuration;
      this.state.danceBoostsUsed++; this.state.addScore(20); this.discoLight.intensity = 3;
      this.particles.spawnSparkles(this.position, 20); this.audio.playDanceBoost();
    }
    if (this.state.danceBoostActive) {
      this.state.danceBoostTimer -= delta; this.particles.spawnSparkles(this.position, 1);
      if (this.state.danceBoostTimer <= 0) { this.state.danceBoostActive = false; this.state.danceBoostCooldown = this.state.danceBoostCooldownDuration; this.discoLight.intensity = 0; }
    }
  }
  animate(delta) {
    const isMoving = this.velocity.z > 1 || Math.abs(this.velocity.x) > 0.5;
    if (this.state.danceBoostActive) { this.danceAnimation(delta); }
    else if (isMoving && this.grounded) {
      this.bobPhase += delta * 12;
      this.leftArm.rotation.x = Math.sin(this.bobPhase)*0.5; this.rightArm.rotation.x = -Math.sin(this.bobPhase)*0.5;
      this.leftLeg.rotation.x = -Math.sin(this.bobPhase)*0.4; this.rightLeg.rotation.x = Math.sin(this.bobPhase)*0.4;
      this.cape.rotation.x = 0.1+Math.sin(this.bobPhase*0.5)*0.15;
    } else if (this.grounded) {
      this.bobPhase += delta*3; this.leftArm.rotation.x=0; this.rightArm.rotation.x=0; this.leftLeg.rotation.x=0; this.rightLeg.rotation.x=0;
    }
  }
  danceAnimation(delta) {
    this.dancePhase += delta*10;
    this.mesh.rotation.y = Math.sin(this.dancePhase)*0.3;
    this.leftArm.rotation.z = 0.3+Math.sin(this.dancePhase*2)*0.5; this.rightArm.rotation.z = -0.3-Math.sin(this.dancePhase*2+1)*0.5;
    this.leftArm.rotation.x = -1.2+Math.sin(this.dancePhase*1.5)*0.3; this.rightArm.rotation.x = -1.2+Math.cos(this.dancePhase*1.5)*0.3;
    this.leftLeg.rotation.x = Math.sin(this.dancePhase*2)*0.3; this.rightLeg.rotation.x = -Math.sin(this.dancePhase*2)*0.3;
  }
  celebrate() { this.celebrating = true; this.celebrateTimer = 2.0; this.dancePhase = 0; }
  onFall() { this.state.falls++; this.audio.playFall(); this.respawn(); }
  respawn() { this.position.set(this.state.spawnPosition.x, this.state.spawnPosition.y, this.state.spawnPosition.z); this.velocity.set(0,0,0); this.grounded = false; }
  setGrounded(y) { if (this.velocity.y<=0) { this.position.y = y+0.3; this.velocity.y=0; if(!this.grounded) this.audio.playLand(); this.grounded=true; this.groundY=y; } }
  bounce(force) { this.velocity.y = force; this.grounded = false; this.audio.playJump(); }
  cleanup() { this.scene.remove(this.mesh); }
}

// ============ CameraController ============
class CameraController {
  constructor(character) {
    this.character = character;
    this.camera = new THREE.PerspectiveCamera(65, window.innerWidth/window.innerHeight, 0.1, 500);
    this.offset = new THREE.Vector3(0, 5, -8);
    this.lookAtOffset = new THREE.Vector3(0, 1.5, 4);
    this.smoothSpeed = 4;
    this.currentPosition = new THREE.Vector3();
    this.currentLookAt = new THREE.Vector3();
    this.shakeIntensity = 0; this.shakeDuration = 0; this.shakeTimer = 0;
    const tp = this.character.position.clone().add(this.offset);
    this.currentPosition.copy(tp); this.camera.position.copy(tp);
    this.currentLookAt.copy(this.character.position).add(this.lookAtOffset);
  }
  update(delta) {
    const tp = this.character.position.clone().add(this.offset);
    if (!this.character.grounded) { const hd = this.character.position.y - this.character.groundY; tp.y += Math.max(0, hd*0.3); }
    this.currentPosition.lerp(tp, this.smoothSpeed*delta);
    const lt = this.character.position.clone().add(this.lookAtOffset);
    this.currentLookAt.lerp(lt, this.smoothSpeed*1.5*delta);
    let sx=0, sy=0;
    if (this.shakeTimer>0) { this.shakeTimer-=delta; const sm=this.shakeIntensity*(this.shakeTimer/this.shakeDuration); sx=(Math.random()-0.5)*sm; sy=(Math.random()-0.5)*sm; }
    this.camera.position.copy(this.currentPosition); this.camera.position.x+=sx; this.camera.position.y+=sy;
    this.camera.lookAt(this.currentLookAt);
  }
  shake(i=0.3,d=0.3) { this.shakeIntensity=i; this.shakeDuration=d; this.shakeTimer=d; }
}

// ============ Obstacles ============
class Obstacle {
  constructor(mesh, scene, type='hazard') { this.mesh=mesh; this.scene=scene; this.type=type; this.disabled=false; scene.add(mesh); }
  update(delta) {} getHazardBounds() { return []; } getBounds() { return null; }
  cleanup() { this.scene.remove(this.mesh); this.mesh.traverse(c=>{if(c.geometry)c.geometry.dispose();if(c.material)c.material.dispose();}); }
}

class RotatingPillow extends Obstacle {
  constructor(scene,x,y,z,length) {
    const group = new THREE.Group(); group.position.set(x,y,z);
    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.15,2,6), new THREE.MeshStandardMaterial({color:0xcccccc})); post.castShadow=true; group.add(post);
    const barGroup = new THREE.Group();
    const barGeo = new THREE.CylinderGeometry(0.1,0.1,length,6); barGeo.rotateZ(Math.PI/2);
    barGroup.add(new THREE.Mesh(barGeo, new THREE.MeshStandardMaterial({color:0xdddddd})));
    for (const side of [-1,1]) {
      const pGeo = new THREE.SphereGeometry(0.5,8,6); pGeo.scale(1.2,0.8,0.8);
      const p = new THREE.Mesh(pGeo, new THREE.MeshStandardMaterial({color:side===1?0xffaacc:0xaaccff,roughness:0.9}));
      p.position.x = side*(length/2-0.3); p.castShadow=true; barGroup.add(p);
    }
    group.add(barGroup);
    super(group,scene,'hazard'); this.barGroup=barGroup; this.speed=0.8; this.length=length; this.x=x; this.y=y; this.z=z;
  }
  update(delta) { this.barGroup.rotation.y += this.speed*delta; }
  getHazardBounds() {
    const angle = this.barGroup.rotation.y; const hl = this.length/2; const bounds=[];
    for (const s of [-1,1]) { const px=this.x+Math.cos(angle)*hl*s; const pz=this.z+Math.sin(angle)*hl*s;
      bounds.push({minX:px-0.6,maxX:px+0.6,minY:this.y-0.5,maxY:this.y+0.5,minZ:pz-0.6,maxZ:pz+0.6}); }
    return bounds;
  }
}

  constructor(scene,x,y,z,w,h,d,axis,range,speed) {

    super(mesh,scene,'platform'); this.originX=x;this.originY=y;this.originZ=z;this.w=w;this.h=h;this.d=d;this.axis=axis;this.range=range;this.speed=speed;this.phase=0;
  }
  update(delta) {
    this.phase+=delta*this.speed; const off=Math.sin(this.phase)*this.range;
    if(this.axis==='x')this.mesh.position.x=this.originX+off;
    else if(this.axis==='y')this.mesh.position.y=this.originY+off-this.h/2;
    else this.mesh.position.z=this.originZ+off;
  }
  getBounds() { const p=this.mesh.position; return{minX:p.x-this.w/2,maxX:p.x+this.w/2,minY:p.y-this.h/2,maxY:p.y+this.h/2,minZ:p.z-this.d/2,maxZ:p.z+this.d/2}; }

class FallingCushionZone extends Obstacle {
  constructor(scene,x,y,z,w,d) {
    const group = new THREE.Group(); group.position.set(x,y,z); super(group,scene,'cushion');
    this.cushions=[]; this.spawnTimer=0; this.spawnInterval=2.5;
    this.zoneX=x;this.zoneY=y;this.zoneZ=z;this.zoneW=w;this.zoneD=d; this.scene=scene;
  }
  update(delta) {
    this.spawnTimer+=delta;
    if(this.spawnTimer>=this.spawnInterval){this.spawnTimer=0;this.spawnCushion();}
    for(let i=this.cushions.length-1;i>=0;i--){const c=this.cushions[i];c.velocity+=-15*delta;c.mesh.position.y+=c.velocity*delta;c.mesh.rotation.x+=delta*2;
      if(c.mesh.position.y<-5){this.scene.remove(c.mesh);c.mesh.geometry.dispose();c.mesh.material.dispose();this.cushions.splice(i,1);}}
  }
  spawnCushion() {
    const colors=[0xff8888,0x88ff88,0x8888ff,0xffff88]; const size=0.5+Math.random()*0.3;
    const geo=new THREE.SphereGeometry(size,8,6); geo.scale(1.2,0.6,1);
    const mat=new THREE.MeshStandardMaterial({color:colors[Math.floor(Math.random()*colors.length)],roughness:0.9});
    const mesh=new THREE.Mesh(geo,mat);
    mesh.position.set(this.zoneX+(Math.random()-0.5)*this.zoneW,this.zoneY,this.zoneZ+(Math.random()-0.5)*this.zoneD);
    mesh.castShadow=true; this.scene.add(mesh); this.cushions.push({mesh,velocity:0});
  }
  getHazardBounds() { return this.cushions.map(c=>({minX:c.mesh.position.x-0.5,maxX:c.mesh.position.x+0.5,minY:c.mesh.position.y-0.3,maxY:c.mesh.position.y+0.3,minZ:c.mesh.position.z-0.5,maxZ:c.mesh.position.z+0.5})); }
  cleanup() { super.cleanup(); for(const c of this.cushions){this.scene.remove(c.mesh);c.mesh.geometry.dispose();c.mesh.material.dispose();}this.cushions=[]; }
}

class CollapsingPlatform extends Obstacle {
  constructor(scene,x,y,z,w,h,d) {
    const mat=new THREE.MeshStandardMaterial({color:0xffcc77,roughness:0.6,emissive:0xff8800,emissiveIntensity:0.1});
    const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); mesh.position.set(x,y-h/2,z); mesh.castShadow=true; mesh.receiveShadow=true;
    super(mesh,scene,'platform'); this.originX=x;this.originY=y;this.originZ=z;this.w=w;this.h=h;this.d=d;
    this.stepped=false;this.collapseTimer=0;this.collapseDelay=2.0;this.fallen=false;this.fallVelocity=0;this.shakePhase=0;this.mat=mat;
  }
  onStep() { if(!this.stepped) this.stepped=true; }
  update(delta) {
    if(this.stepped&&!this.fallen){this.collapseTimer+=delta;this.shakePhase+=delta*30;this.mesh.position.x=this.originX+Math.sin(this.shakePhase)*0.05;this.mat.emissiveIntensity=0.1+(this.collapseTimer/this.collapseDelay)*0.5;if(this.collapseTimer>=this.collapseDelay)this.fallen=true;}
    if(this.fallen){this.fallVelocity+=-20*delta;this.mesh.position.y+=this.fallVelocity*delta;this.mesh.rotation.x+=delta*2;if(this.mesh.position.y<-30){this.disabled=true;this.mesh.visible=false;}}
  }
  getBounds() { if(this.disabled||this.fallen)return null;const p=this.mesh.position;return{minX:p.x-this.w/2,maxX:p.x+this.w/2,minY:p.y-this.h/2,maxY:p.y+this.h/2,minZ:p.z-this.d/2,maxZ:p.z+this.d/2}; }
}

    const shorts=new THREE.Mesh(new THREE.CylinderGeometry(0.42,0.35,0.3,8),new THREE.MeshStandardMaterial({color:0x445566}));
    shorts.position.y=0.1; g.add(shorts);
    // Socks + sandals (classic dad)
    const sockMat=new THREE.MeshStandardMaterial({color:0xffffff});
    const sandMat=new THREE.MeshStandardMaterial({color:0x8B4513});
    for(const sx of [-0.15,0.15]) {
      const sock=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.07,0.25,6),sockMat); sock.position.set(sx,-0.15,0); g.add(sock);
      const sandal=new THREE.Mesh(new THREE.BoxGeometry(0.18,0.05,0.25),sandMat); sandal.position.set(sx,-0.28,0.03); g.add(sandal);
    }
    // Props per type
    if(dadType==='bbq'){
      const spatula=new THREE.Mesh(new THREE.BoxGeometry(0.06,0.8,0.06),new THREE.MeshStandardMaterial({color:0x888888}));
      spatula.position.set(0.5,0.9,0.2); spatula.rotation.z=-0.3; g.add(spatula);
    }
    // Arms
    this.lArm=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.07,0.5,6),new THREE.MeshStandardMaterial({color:0xffcc99}));
    this.lArm.position.set(-0.5,0.7,0); this.lArm.rotation.z=0.3; g.add(this.lArm);
    this.rArm=this.lArm.clone(); this.rArm.position.set(0.5,0.7,0); this.rArm.rotation.z=-0.3; g.add(this.rArm);
    super(g,scene,dadType==='jumper'?'bouncy':'dad');
    this.dadType=dadType;this.originX=x;this.originY=y;this.z=z;this.phase=Math.random()*Math.PI*2;
    this.bounceForce=16;
  }
  update(delta) {
    this.phase+=delta*3;
    if(this.dadType==='dancer'){this.mesh.rotation.y=Math.sin(this.phase)*0.5;this.lArm.rotation.x=-1.2+Math.sin(this.phase*2)*0.5;this.rArm.rotation.x=-1.2+Math.cos(this.phase*2)*0.5;}
    else if(this.dadType==='bbq'){this.lArm.rotation.x=Math.sin(this.phase)*0.3;this.mesh.position.x=this.originX+Math.sin(this.phase*0.3)*1;}
    else if(this.dadType==='jumper'){this.mesh.position.y=this.originY+Math.abs(Math.sin(this.phase))*2;}
    else if(this.dadType==='spinner'){this.mesh.rotation.y+=delta*5;this.mesh.position.x=this.originX+Math.sin(this.phase*0.5)*2;}
  }
  getHazardBounds() {
    const p=this.mesh.position;
    return [{minX:p.x-0.6,maxX:p.x+0.6,minY:p.y-0.3,maxY:p.y+1.8,minZ:p.z-0.6,maxZ:p.z+0.6}];
  }
}

class FireDragon {
  constructor(scene) {
    this.scene=scene; this.phase=0; this.fireTimer=0; this.fireParticles=[];
    const g=new THREE.Group();
    // Body (dark green/purple)
    const bodyGeo=new THREE.SphereGeometry(1.8,10,8); bodyGeo.scale(2,0.8,0.8);
    const bodyMat=new THREE.MeshStandardMaterial({color:0x225522,roughness:0.7,metalness:0.2});
    const body=new THREE.Mesh(bodyGeo,bodyMat); body.castShadow=true; g.add(body);
    // Belly (lighter)
    const bellyGeo=new THREE.SphereGeometry(1.4,8,6); bellyGeo.scale(1.8,0.6,0.6);
    const belly=new THREE.Mesh(bellyGeo,new THREE.MeshStandardMaterial({color:0x88aa44,roughness:0.8}));
    belly.position.y=-0.3; belly.position.z=0.3; g.add(belly);
    // Head
    const headGeo=new THREE.SphereGeometry(0.8,10,8); headGeo.scale(1.3,1,1);
    const head=new THREE.Mesh(headGeo,bodyMat); head.position.set(3.5,0.5,0); head.castShadow=true; g.add(head);
    // Snout
    const snout=new THREE.Mesh(new THREE.ConeGeometry(0.4,1.2,6),bodyMat);
    snout.position.set(4.8,0.3,0); snout.rotation.z=-Math.PI/2; g.add(snout);
    // Nostrils (glowing orange)
    const nostrilMat=new THREE.MeshStandardMaterial({color:0xff4400,emissive:0xff2200,emissiveIntensity:0.8});
    const ln=new THREE.Mesh(new THREE.SphereGeometry(0.08,6,4),nostrilMat); ln.position.set(5.3,0.4,0.15); g.add(ln);
    const rn=new THREE.Mesh(new THREE.SphereGeometry(0.08,6,4),nostrilMat); rn.position.set(5.3,0.4,-0.15); g.add(rn);
    // Eyes (yellow with slit pupils)
    const eyeMat=new THREE.MeshStandardMaterial({color:0xffcc00,emissive:0xff8800,emissiveIntensity:0.5});
    const le=new THREE.Mesh(new THREE.SphereGeometry(0.2,8,8),eyeMat); le.position.set(3.8,1,0.6); g.add(le);
    const re=le.clone(); re.position.set(3.8,1,-0.6); g.add(re);
    const pupMat=new THREE.MeshStandardMaterial({color:0x111111});
    const dlp=new THREE.Mesh(new THREE.SphereGeometry(0.08,4,4),pupMat); dlp.position.set(3.95,1,0.7); g.add(dlp);
    const drp=new THREE.Mesh(new THREE.SphereGeometry(0.08,4,4),pupMat); drp.position.set(3.95,1,-0.7); g.add(drp);
    // Horns
    const hornMat=new THREE.MeshStandardMaterial({color:0x444444,roughness:0.5});
    const lh=new THREE.Mesh(new THREE.ConeGeometry(0.12,0.8,5),hornMat); lh.position.set(3.2,1.3,0.4); lh.rotation.z=0.3; g.add(lh);
    const rh=lh.clone(); rh.position.set(3.2,1.3,-0.4); rh.rotation.z=0.3; g.add(rh);
    // Wings
    this.wings=[];
    for(const side of [-1,1]){
      const wingGeo=new THREE.PlaneGeometry(3,2); wingGeo.translate(1.5,0,0);
      const wing=new THREE.Mesh(wingGeo,new THREE.MeshStandardMaterial({color:0x336633,side:THREE.DoubleSide,transparent:true,opacity:0.8}));
      wing.position.set(0,0.5,side*1.5); wing.rotation.x=side*0.3; wing.castShadow=true; g.add(wing);
      this.wings.push(wing);
    }
    // Tail (series of spheres)
    for(let i=0;i<6;i++){
      const ts=0.6-i*0.08;
      const tSeg=new THREE.Mesh(new THREE.SphereGeometry(ts,6,5),bodyMat);
      tSeg.position.set(-2-i*0.8,Math.sin(i*0.5)*0.3,0); tSeg.castShadow=true; g.add(tSeg);
    }
    // Tail spike
    const spike=new THREE.Mesh(new THREE.ConeGeometry(0.15,0.6,4),new THREE.MeshStandardMaterial({color:0x882222}));
    spike.position.set(-6.8,0,0); spike.rotation.z=Math.PI/2; g.add(spike);
    // Spines along back
    for(let i=0;i<8;i++){
      const spine=new THREE.Mesh(new THREE.ConeGeometry(0.08,0.4,4),new THREE.MeshStandardMaterial({color:0x338833}));
      spine.position.set(2-i*0.8,0.9,0); g.add(spine);
    }
    // Fire glow light
    this.fireLight=new THREE.PointLight(0xff4400,0,20);
    this.fireLight.position.set(5.5,0.3,0); g.add(this.fireLight);
    g.position.set(0,18,50);
    g.scale.set(1.5,1.5,1.5);
    scene.add(g); this.mesh=g;
  }
  update(delta, playerPos) {
    this.phase+=delta*0.3;
    // Fly in large circles
    this.mesh.position.x=Math.sin(this.phase)*25;
    this.mesh.position.z=playerPos.z+15+Math.cos(this.phase*0.6)*20;
    this.mesh.position.y=16+Math.sin(this.phase*1.5)*3;
    this.mesh.rotation.y=Math.cos(this.phase)*0.4+Math.PI/2;
    // Wing flap
    for(let i=0;i<this.wings.length;i++){
      const side=i===0?1:-1;
      this.wings[i].rotation.x=side*(0.3+Math.sin(this.phase*4)*0.4);
    }
    // Fire breathing every ~4 seconds
    this.fireTimer+=delta;
    if(this.fireTimer>4){
      this.fireTimer=0;
      this.breatheFire();
    }
    // Update fire particles
    for(let i=this.fireParticles.length-1;i>=0;i--){
      const fp=this.fireParticles[i];
      fp.life-=delta;
      fp.mesh.position.add(fp.vel.clone().multiplyScalar(delta));
      fp.vel.y-=2*delta;
      fp.mesh.material.opacity=Math.max(0,fp.life/fp.maxLife);
      const s=0.3+fp.life/fp.maxLife*0.7;
      fp.mesh.scale.setScalar(s);
      if(fp.life<=0){this.scene.remove(fp.mesh);fp.mesh.geometry.dispose();fp.mesh.material.dispose();this.fireParticles.splice(i,1);}
    }
    // Fire light intensity
    this.fireLight.intensity=this.fireParticles.length>0?3:0;
  }
  breatheFire() {
    const worldPos=new THREE.Vector3();
    this.mesh.getWorldPosition(worldPos);
    const dir=new THREE.Vector3(Math.cos(this.mesh.rotation.y-Math.PI/2),
      -0.3,Math.sin(this.mesh.rotation.y-Math.PI/2));
    const fireColors=[0xff4400,0xff6600,0xff8800,0xffaa00,0xffcc00];
    for(let i=0;i<20;i++){
      const geo=new THREE.SphereGeometry(0.3+Math.random()*0.4,6,4);
      const mat=new THREE.MeshBasicMaterial({color:fireColors[Math.floor(Math.random()*fireColors.length)],transparent:true,opacity:1});
      const mesh=new THREE.Mesh(geo,mat);
      mesh.position.copy(worldPos);
      mesh.position.x+=dir.x*8; mesh.position.y+=dir.y*8+1; mesh.position.z+=dir.z*8;
      this.scene.add(mesh);
      const vel=dir.clone().multiplyScalar(5+Math.random()*8);
      vel.x+=(Math.random()-0.5)*3; vel.y+=(Math.random()-0.5)*2; vel.z+=(Math.random()-0.5)*3;
      this.fireParticles.push({mesh,vel,life:1+Math.random()*0.5,maxLife:1.5});
    }
  }
  cleanup() {
    this.scene.remove(this.mesh);
    for(const fp of this.fireParticles){this.scene.remove(fp.mesh);fp.mesh.geometry.dispose();fp.mesh.material.dispose();}
    this.fireParticles=[];
  }
}

// ============ LevelManager ============
class LevelManager {
  constructor(scene,state,character,audio,particles) {
    this.scene=scene;this.state=state;this.character=character;this.audio=audio;this.particles=particles;
    this.obstacles=[];this.platforms=[];this.checkpoints=[];this.portal=null;this.levelObjects=[];this.collapsingPlatforms=[];this.alarmTickTimer=0;
    this.friends=[];this.helicopter=null;this.heliRotor=null;this.tailRotor=null;this.heliPhase=0;
    this.dragon=null;
  }
  loadLevel(n) {
    this.state.currentLevel=n;
    const builders={1:'buildBedroomChaos',2:'buildSchoolyard',3:'buildAngryTeachers',4:'buildMonsterForest',5:'buildCrazyDads',6:'buildGrandFinale'};
    const method=builders[n]||'buildBedroomChaos';
    this[method]();
  }
  buildBedroomChaos() {
    this.scene.background = new THREE.Color(0x88aaff);
    this.scene.fog = new THREE.FogExp2(0xaabbff, 0.004);

    // === START - big wide platform ===
    this.addPlatform(0,0,0,14,1,10,0xaaddaa);

    // === SECTION A - easy run with slow rotating pillow ===
    this.addPlatform(0,0,14,12,1,20,0xeeddcc);
    const p1=new RotatingPillow(this.scene,0,1.5,12,4); this.addObstacle(p1);
    const b1=new BouncyBed(this.scene,0,0.5,20); this.addObstacle(b1);

    // === Small gap with wide platforms ===
    this.addPlatform(0,0,28,10,1,6,0xddccee);
    this.addPlatform(0,0,38,10,1,6,0xddccee);
    const mp1=new MovingPlatform(this.scene,0,0,33,5,1,4,'x',3,1.0); this.addObstacle(mp1); this.platforms.push(mp1);

    // === CHECKPOINT 1 ===
    this.addCheckpoint(0,1,40);

    // === Zonnebloem School building (naast het pad) ===
    this.addZonnebloemSchool(12, 0, 45);

    // === SECTION B - gentle run ===
    this.addPlatform(0,0,46,12,1,24,0xeeddcc);
    const sl1=new SlipperyFloor(this.scene,0,0.52,50,10,6); this.addObstacle(sl1);
    const cz1=new FallingCushionZone(this.scene,0,10,58,6,6); this.addObstacle(cz1);

    // === Gentle stepping up (wider, lower steps) ===
    this.addPlatform(0,1,66,6,1,4,0xffccaa);
    this.addPlatform(0,2,72,6,1,4,0xffccaa);
    this.addPlatform(0,3,78,10,1,6,0xddddee);

    // === CHECKPOINT 2 ===
    this.addCheckpoint(0,4,80);

    // === HARD SECTION (but easier than before) ===
    this.addPlatform(0,3,86,10,1,12,0xeeddcc);
    const c1=new CollapsingPlatform(this.scene,0,3,94,5,0.5,4); this.addObstacle(c1); this.platforms.push(c1); this.collapsingPlatforms.push(c1);
    const c2=new CollapsingPlatform(this.scene,0,3,100,5,0.5,4); this.addObstacle(c2); this.platforms.push(c2); this.collapsingPlatforms.push(c2);

    // === Final platform + portal ===
    this.addPlatform(0,3,106,12,1,8,0xddffdd);
    this.addPortal(0,5,108);

    // === Helicopter flying around ===
    this.addHelicopter();

    // === Fire Dragon! ===
    this.dragon=new FireDragon(this.scene);

    // === Decorations ===

  addObstacle(o) { this.obstacles.push(o); }
  update(delta) {
    if(this.state.levelComplete||this.state.gameOver)return;
    this.updateTimer(delta);
    const sm=this.state.danceBoostActive?0.8:1.0;
    for(const o of this.obstacles)if(o.update)o.update(delta*sm);
    this.checkPlatformCollisions(); this.checkCheckpoints(); this.checkPortal(); this.checkObstacleCollisions(delta);
    if(this.portal){this.portal.ring.rotation.z+=delta*1.5;this.portal.inner.opacity=0.4+Math.sin(Date.now()*0.003)*0.2;this.particles.spawnPortalParticles(this.portal.position,1);}
    for(const f of this.friends) f.update(delta, this.character.position);
    if(this.dragon) this.dragon.update(delta, this.character.position);
    if(this.helicopter){
      this.heliPhase+=delta*0.4;
      this.helicopter.position.x=Math.sin(this.heliPhase)*20;
      this.helicopter.position.z=this.character.position.z+10+Math.cos(this.heliPhase*0.7)*15;
      this.helicopter.position.y=14+Math.sin(this.heliPhase*1.3)*2;
      this.helicopter.rotation.y=Math.sin(this.heliPhase)*0.3+Math.PI/2;
      if(this.heliRotor)this.heliRotor.rotation.y+=delta*25;
      if(this.tailRotor)this.tailRotor.rotation.z+=delta*30;
    }
  }
  updateTimer(delta) {
    this.state.levelTime+=delta;this.state.collapsePercent=Math.min((this.state.levelTime/this.state.levelDuration)*100,100);
    if(this.state.collapsePercent>=80&&this.state.collapsePercent<100){
      this.scene.background=new THREE.Color().lerpColors(new THREE.Color(0x88aaff),new THREE.Color(0x6633aa),(this.state.collapsePercent-80)/20);
      this.alarmTickTimer-=delta;if(this.alarmTickTimer<=0){this.audio.playAlarmTick();this.alarmTickTimer=1.0;}
    }
    if(this.state.collapsePercent>=100)this.onDreamCollapse();
  }
  onDreamCollapse() {
    if(!this._collapseStarted){this._collapseStarted=true;this._collapseZ=this.character.position.z-15;this.audio.playCollapse();}
    this._collapseZ+=0.1;
    for(const p of this.platforms){if(p.mesh&&p.bounds&&p.bounds.maxZ<this._collapseZ){if(p.mesh.visible){p.mesh.visible=false;p.disabled=true;}}}
    if(this.character.position.z<this._collapseZ){this.state.gameOver=true;this.state.playing=false;window.game.ui.showScreen('game-over');}
  }
  checkPlatformCollisions() {
    const char=this.character;const pos=char.position;const r=char.colliderRadius;let on=false;
    for(const plat of this.platforms){if(plat.disabled)continue;let bounds;if(plat.getBounds)bounds=plat.getBounds();else if(plat.bounds)bounds=plat.bounds;else continue;if(!bounds)continue;
      if(pos.x+r>bounds.minX&&pos.x-r<bounds.maxX&&pos.z+r>bounds.minZ&&pos.z-r<bounds.maxZ){
        if(pos.y>=bounds.maxY-0.1&&pos.y<=bounds.maxY+1.5&&char.velocity.y<=0){char.setGrounded(bounds.maxY);on=true;if(plat.onStep)plat.onStep();if(plat.type==='slippery')char.velocity.x*=1.02;}
        else if(pos.y+0.5>bounds.minY&&pos.y<bounds.maxY){const o1=bounds.maxX-(pos.x-r);const o2=(pos.x+r)-bounds.minX;const o3=bounds.maxZ-(pos.z-r);const o4=(pos.z+r)-bounds.minZ;
          const m=Math.min(o1,o2,o3,o4);if(m===o1&&char.velocity.x<0)pos.x=bounds.maxX+r;else if(m===o2&&char.velocity.x>0)pos.x=bounds.minX-r;}
      }
    }
    if(!on)char.grounded=false;
  }
  checkCheckpoints() {
    const pos=this.character.position;
    for(const cp of this.checkpoints){if(cp.triggered)continue;if(pos.distanceTo(cp.position)<2.5){
      cp.triggered=true;this.state.checkpointsReached++;this.state.spawnPosition={x:cp.position.x,y:cp.position.y+1,z:cp.position.z};
      this.state.addScore(100);this.character.celebrate();this.audio.playCheckpoint();this.particles.spawnConfetti(cp.position,40);
      const ci=document.getElementById('checkpoint-icon');ci.style.display='block';ci.style.animation='none';ci.offsetHeight;ci.style.animation='checkpointFade 2s forwards';setTimeout(()=>{ci.style.display='none';},2000);
    }}
  }
  checkPortal() { if(!this.portal||this.state.levelComplete)return; if(this.character.position.distanceTo(this.portal.position)<4)this.onLevelComplete(); }
  onLevelComplete() {
    if(this.state.levelComplete)return;
    this.state.levelComplete=true;this.state.addScore(500);
    if(this.state.falls===0)this.state.addScore(300);
    const ft=this.state.levelDuration*0.5;if(this.state.levelTime<ft)this.state.addScore(Math.floor(500*(1-this.state.levelTime/ft)));
    this.audio.playPortal();this.particles.spawnConfetti(this.character.position,60);
    this.state.playing=false;
    try{window.game.ui.showLevelComplete();}catch(e){setTimeout(()=>{try{window.game.ui.showLevelComplete();}catch(e2){}},500);}
  }
  checkObstacleCollisions(delta) {
    const pos=this.character.position;
    for(const obs of this.obstacles){if(!obs.getHazardBounds)continue;const hazards=obs.getHazardBounds();
      for(const h of hazards){if(pos.x>h.minX&&pos.x<h.maxX&&pos.y>h.minY&&pos.y<h.maxY&&pos.z>h.minZ&&pos.z<h.maxZ){
        if(obs.type==='bouncy'){this.character.bounce(obs.bounceForce||15);this.audio.playBounce();}
        else if(obs.type==='cushion'){this.character.velocity.x+=(Math.random()-0.5)*5;this.character.velocity.y=3;}
        else if(obs.type==='teacher'){this.character.velocity.z=-obs.knockbackForce;this.character.velocity.y=5;this.audio.playFall();this.camera&&this.camera.shake&&this.camera.shake(0.3,0.3);}
        else if(obs.type==='monster'){this.character.velocity.z=-12;this.character.velocity.y=8;this.character.velocity.x=(Math.random()-0.5)*6;this.audio.playFall();this.camera&&this.camera.shake&&this.camera.shake(0.5,0.4);}
        else if(obs.type==='dad'){this.character.velocity.x+=(Math.random()-0.5)*8;this.character.velocity.y=4;this.audio.playBounce();}
      }}
    }
  }
  cleanup() {
    for(const o of this.levelObjects){this.scene.remove(o);o.traverse(c=>{if(c.geometry)c.geometry.dispose();if(c.material){if(Array.isArray(c.material))c.material.forEach(m=>m.dispose());else c.material.dispose();}});}
    for(const o of this.obstacles)if(o.cleanup)o.cleanup();
    for(const f of this.friends) f.cleanup();
    if(this.dragon){this.dragon.cleanup();this.dragon=null;}
    this.levelObjects=[];this.platforms=[];this.obstacles=[];this.checkpoints=[];this.portal=null;this.collapsingPlatforms=[];this._collapseStarted=false;
    this.friends=[];this.helicopter=null;this.heliRotor=null;this.tailRotor=null;this.heliPhase=0;
  }
}

// ============ UIManager ============
class UIManager {
  constructor(state,game) {
    this.state=state;this.game=game;
    this.screens={'main-menu':document.getElementById('main-menu'),'hud':document.getElementById('hud'),'level-complete':document.getElementById('level-complete'),'game-over':document.getElementById('game-over')};
    this.setupButtons();
  }
  setupButtons() {
    document.getElementById('btn-play').addEventListener('click',()=>{this.game.audio.init();this.game.startGame();});
    document.getElementById('btn-level-select').addEventListener('click',()=>{this.game.audio.init();this.game.startGame();});
    document.getElementById('btn-settings').addEventListener('click',()=>{alert('Settings coming soon!');});
    document.getElementById('btn-next-level').addEventListener('click',()=>{this.game.nextLevel();});
    document.getElementById('btn-replay').addEventListener('click',()=>{this.game.restartLevel();});
    document.getElementById('btn-menu').addEventListener('click',()=>{this.game.showMenu();});
    document.getElementById('btn-retry').addEventListener('click',()=>{this.game.restartLevel();});
    document.getElementById('btn-gameover-menu').addEventListener('click',()=>{this.game.showMenu();});
  }
  showScreen(id) { for(const[name,el]of Object.entries(this.screens))el.style.display=name===id?'':'none'; }
  showLevelComplete() {
    const stars=this.state.getStarRating();const el=document.getElementById('stars-display');
    let h='';for(let i=0;i<3;i++){if(i<stars)h+='<span style="color:#FFD700;text-shadow:0 0 10px #FFD700;">&#9733;</span>';else h+='<span style="color:#555;">&#9733;</span>';}
    el.innerHTML=h;document.getElementById('final-score').textContent=this.state.score;
    const bonuses=[];if(this.state.falls===0)bonuses.push('No Falls Bonus: +300');if(this.state.levelTime<this.state.levelDuration*0.5)bonuses.push('Speed Bonus!');
    document.getElementById('bonus-text').textContent=bonuses.join(' | ');
    const levelNames={1:'Slaapkamer Chaos',2:'De Vruchtenbuurt',3:'Citroenstraat & Speeltuinen',4:'De Duinen & Bosjes van Pex',5:'Kijkduin Strand',6:'De Grote Finale'};
    const lct=document.getElementById('level-complete-title');
    if(lct)lct.textContent=`Level ${this.state.currentLevel} Gehaald!`;
    const bnl=document.getElementById('btn-next-level');
    if(bnl)bnl.textContent=this.state.currentLevel>=6?'Terug naar Menu':'Volgend Level';
    this.showScreen('level-complete');
  }
  update(delta) {
    if(!this.state.playing)return;
    const levelNames={1:'Slaapkamer Chaos',2:'De Vruchtenbuurt',3:'Citroenstraat & Speeltuinen',4:'De Duinen & Bosjes van Pex',5:'Kijkduin Strand',6:'De Grote Finale'};
    const ln=document.getElementById('level-name');if(ln)ln.textContent=`Level ${this.state.currentLevel}: ${levelNames[this.state.currentLevel]||'???'}`;
    const tb=document.getElementById('timer-bar');const tl=document.getElementById('timer-label');
    tb.style.width=`${this.state.collapsePercent}%`;
    if(this.state.collapsePercent<50)tl.textContent='Dream Stable';else if(this.state.collapsePercent<80)tl.textContent='Dream Weakening...';else tl.textContent='DREAM COLLAPSING!';
    document.getElementById('score-value').textContent=this.state.score;
    const db=document.getElementById('dance-cooldown-bar');const dl=document.getElementById('dance-label');
    if(this.state.danceBoostActive){const p=(this.state.danceBoostTimer/this.state.danceBoostDuration)*100;db.style.width=`${p}%`;db.style.background='linear-gradient(90deg,#ff00ff,#ffff00)';dl.textContent='DANCING!';}
    else if(this.state.danceBoostCooldown>0){const p=(1-this.state.danceBoostCooldown/this.state.danceBoostCooldownDuration)*100;db.style.width=`${p}%`;db.style.background='linear-gradient(90deg,#666,#888)';dl.textContent=`Cooldown ${Math.ceil(this.state.danceBoostCooldown)}s`;}
    else{db.style.width='100%';db.style.background='linear-gradient(90deg,#e040fb,#7c4dff)';dl.textContent='Dance [E]';}
    document.getElementById('gameover-score').textContent=this.state.score;
  }
}

// ============ Game ============
class Game {
  constructor() {
    this.canvas=document.getElementById('game-canvas');
    this.renderer=new THREE.WebGLRenderer({canvas:this.canvas,antialias:true});
    this.renderer.setSize(window.innerWidth,window.innerHeight);
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
    this.renderer.shadowMap.enabled=true;this.renderer.shadowMap.type=THREE.PCFSoftShadowMap;
    this.renderer.toneMapping=THREE.ACESFilmicToneMapping;this.renderer.toneMappingExposure=1.2;
    this.scene=new THREE.Scene();this.clock=new THREE.Clock();
    this.state=new GameState();this.input=new InputManager();this.audio=new AudioManager();
    this.particles=new ParticleSystem(this.scene);this.ui=new UIManager(this.state,this);
    this.character=null;this.camera=null;this.levelManager=null;
    this.setupLighting();this.setupEventListeners();this.animate();
  }
  setupLighting() {
    this.scene.add(new THREE.AmbientLight(0x9999cc,0.6));
    const sun=new THREE.DirectionalLight(0xffeedd,1.2);sun.position.set(30,50,30);sun.castShadow=true;
    sun.shadow.mapSize.width=2048;sun.shadow.mapSize.height=2048;sun.shadow.camera.near=0.5;sun.shadow.camera.far=200;
    sun.shadow.camera.left=-60;sun.shadow.camera.right=60;sun.shadow.camera.top=60;sun.shadow.camera.bottom=-60;
    this.scene.add(sun);this.sun=sun;this.scene.add(new THREE.HemisphereLight(0x88aaff,0xffaa88,0.4));
  }
  setupEventListeners() {
    window.addEventListener('resize',()=>{this.renderer.setSize(window.innerWidth,window.innerHeight);if(this.camera){this.camera.camera.aspect=window.innerWidth/window.innerHeight;this.camera.camera.updateProjectionMatrix();}});
  }
  startGame() {
    try {
      this.state.reset();this.scene.fog=new THREE.FogExp2(0xccccff,0.008);this.scene.background=new THREE.Color(0x88aaff);
      this.character=new CharacterController(this.scene,this.state,this.input,this.audio,this.particles);
      this.camera=new CameraController(this.character);
      this.levelManager=new LevelManager(this.scene,this.state,this.character,this.audio,this.particles);
      this.levelManager.camera=this.camera;
      this.levelManager.loadLevel(1);this.ui.showScreen('hud');this.state.playing=true;
    } catch(e) {
      console.error('startGame error:', e);
      alert('Game error: ' + e.message);
    }
  }
  cleanScene() {
    const toRemove=[];
    this.scene.traverse(c=>{if(c!==this.scene&&(c instanceof THREE.Mesh||c instanceof THREE.Group)&&!c.isLight)toRemove.push(c);});
    toRemove.forEach(o=>{if(o.parent)o.parent.remove(o);});
  }
  nextLevel() {
    const nextLvl=this.state.currentLevel+1;
    if(nextLvl>6){this.showMenu();return;}
    const oldScore=this.state.score;
    if(this.levelManager)this.levelManager.cleanup();if(this.character)this.character.cleanup();
    this.cleanScene();
    this.state.reset();this.state.score=oldScore;this.state.currentLevel=nextLvl;
    this.character=new CharacterController(this.scene,this.state,this.input,this.audio,this.particles);
    this.camera=new CameraController(this.character);
    this.levelManager=new LevelManager(this.scene,this.state,this.character,this.audio,this.particles);
    this.levelManager.camera=this.camera;
    this.levelManager.loadLevel(nextLvl);this.ui.showScreen('hud');this.state.playing=true;
  }
  restartLevel() {
    const lvl=this.state.currentLevel||1;
    if(this.levelManager)this.levelManager.cleanup();if(this.character)this.character.cleanup();
    this.cleanScene();
    this.state.reset();this.state.currentLevel=lvl;
    this.character=new CharacterController(this.scene,this.state,this.input,this.audio,this.particles);
    this.camera=new CameraController(this.character);
    this.levelManager=new LevelManager(this.scene,this.state,this.character,this.audio,this.particles);
    this.levelManager.camera=this.camera;
    this.levelManager.loadLevel(lvl);this.ui.showScreen('hud');this.state.playing=true;
  }
  animate() {
    requestAnimationFrame(()=>this.animate());const delta=Math.min(this.clock.getDelta(),0.05);
    if(this.state.playing&&!this.state.paused){
      this.input.update();if(this.input.keys.r){this.input.keys.r=false;this.restartLevel();return;}
      if(this.character)this.character.update(delta);if(this.camera)this.camera.update(delta);
      if(this.levelManager)this.levelManager.update(delta);this.particles.update(delta);this.ui.update(delta);
      if(this.character&&this.sun){this.sun.target.position.copy(this.character.position);this.sun.position.set(this.character.position.x+30,50,this.character.position.z+30);}
    }
    if(this.camera)this.renderer.render(this.scene,this.camera.camera);
  }
  showMenu() {
    this.state.playing=false;if(this.levelManager)this.levelManager.cleanup();if(this.character)this.character.cleanup();
    this.character=null;this.camera=null;this.levelManager=null;
    const toRemove=[];this.scene.traverse(c=>{if(c instanceof THREE.Mesh||c instanceof THREE.Group)toRemove.push(c);});
    toRemove.forEach(o=>{if(o.parent===this.scene)this.scene.remove(o);});this.ui.showScreen('main-menu');
  }
}

try {
  const game = new Game();
  window.game = game;
} catch(e) {
  console.error('Game init error:', e);
  document.getElementById('main-menu').innerHTML = '<div class="menu-content"><h1 style="color:#ff4444;">Error</h1><p style="color:white;">'+e.message+'</p></div>';
}
</script>
<script>
// Fallback: if module fails to load, show error and make Play retry
window.addEventListener('DOMContentLoaded', function() {
  setTimeout(function() {
    if (!window.game) {
      console.error('Game module failed to load');
      var btn = document.getElementById('btn-play');
      if (btn) btn.addEventListener('click', function() { location.reload(); });
    }
  }, 3000);
});
</script>
